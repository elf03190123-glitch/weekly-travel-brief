<title>한국 주간 트래블 브리프 V2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#eef1f4; --surface:#ffffff; --surface-2:#f7f9fb;
  --ink:#0d151c; --ink-2:#54646f; --ink-3:#8494a0;
  --rule:#d3dae0; --rule-soft:#e4e9ed;
  --accent:#b3122b; --accent-soft:#fae8eb;
  --steel:#25607f; --steel-soft:#e5eff5;
  --amber:#96600a; --amber-soft:#faf0dc;
  --shadow:0 1px 2px rgba(13,21,28,.06),0 8px 24px -16px rgba(13,21,28,.28);
  --ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --en:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --disp:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0b1116; --surface:#131b21; --surface-2:#0f171d;
    --ink:#e3eaf0; --ink-2:#8d9daa; --ink-3:#6b7c88;
    --rule:#222e37; --rule-soft:#1a242c;
    --accent:#ff6076; --accent-soft:#2b1219;
    --steel:#78b2d6; --steel-soft:#122430;
    --amber:#e0a34a; --amber-soft:#2a2114;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0b1116; --surface:#131b21; --surface-2:#0f171d;
  --ink:#e3eaf0; --ink-2:#8d9daa; --ink-3:#6b7c88;
  --rule:#222e37; --rule-soft:#1a242c;
  --accent:#ff6076; --accent-soft:#2b1219;
  --steel:#78b2d6; --steel-soft:#122430;
  --amber:#e0a34a; --amber-soft:#2a2114;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ko);
  font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 96px}

/* ---------- masthead ---------- */
.mast{border-bottom:2px solid var(--ink);padding:44px 0 18px;margin-bottom:0}
.mast-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px}
.brandline{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:500}
.issue{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,4.6vw,46px);line-height:1.18;
  margin:14px 0 6px;letter-spacing:-.02em;text-wrap:balance}
.sub{font-size:14px;color:var(--ink-2);margin:0 0 18px}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.byline{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:8px;padding-bottom:6px;text-align:left}
.byline b{color:var(--ink-2);font-weight:500}
.meta b{color:var(--ink-2);font-weight:500}

/* ---------- indicator strip ---------- */
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;
  background:var(--rule-soft);border:1px solid var(--rule);margin:26px 0 0}
.ind-c{background:var(--surface);padding:14px 18px 15px;min-width:0}
.ind-k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.ind-v{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1.1;margin-top:6px;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.ind-u{font-size:12px;color:var(--ink-3);margin-left:5px;letter-spacing:.04em}
.ind-s{font-size:11.5px;color:var(--ink-2);margin-top:5px}
.ind-src{margin-top:6px}
.ind-src a{font-family:var(--mono);font-size:9.5px;color:var(--steel);text-decoration:none;
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.ind-src a:hover,.ind-src a:focus-visible{text-decoration:underline;opacity:1}

/* ---------- scoreboard ---------- */
.board{background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  margin:14px 0 8px;padding:20px 22px;box-shadow:var(--shadow)}
.board h2{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 4px;font-weight:500}
.board .note{font-size:12.5px;color:var(--ink-2);margin:0 0 16px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--rule-soft);
  border:1px solid var(--rule-soft)}
.acc{background:var(--surface);padding:12px 14px 13px}
.acc .n{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.acc .n.zero{color:var(--ink-3)}
.acc .nm{font-size:13px;font-weight:600;margin-top:7px}
.acc .ds{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.acc.hot{box-shadow:inset 3px 0 0 var(--accent)}
.acc.cold{box-shadow:inset 3px 0 0 var(--rule)}

/* ---------- fuel surcharge table ---------- */
.fuel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  margin:14px 0 8px;padding:20px 22px;box-shadow:var(--shadow)}
.fuel h2{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 4px;font-weight:500}
.fuel .note{font-size:12.5px;color:var(--ink-2);margin:0 0 16px}
.fuel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--rule-soft);
  border:1px solid var(--rule-soft)}
.fuel-c{background:var(--surface);padding:12px 14px 13px}
.fuel-nm{font-size:13px;font-weight:600}
.fuel-en{font-family:var(--en);font-size:11px;font-weight:400;color:var(--ink-3)}
.fuel-rows{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.fuel-r{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.fuel-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--steel)}
.fuel-v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.fuel-v i{font-style:normal;font-size:10.5px;color:var(--ink-3);margin-left:3px}
.fuel-v.na{font-family:var(--ko);font-size:12px;color:var(--ink-3)}
.fuel-foot{font-size:11.5px;color:var(--ink-2);margin:12px 0 0}
.fuel-src{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin:6px 0 0}

/* ---------- controls ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);
  padding:10px 0;margin-top:26px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.navlinks{display:flex;flex-wrap:wrap;gap:2px}
.navlinks a{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-2);
  text-decoration:none;padding:5px 9px;border-radius:2px;white-space:nowrap}
.navlinks a:hover,.navlinks a:focus-visible{background:var(--surface);color:var(--ink);outline:none}
.navlinks a.new{color:var(--amber)}

/* ---------- sections ---------- */
section{margin-top:44px;scroll-margin-top:64px}
.shead{display:flex;align-items:flex-end;gap:12px;justify-content:space-between;
  border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:2px}
.shead h2{font-family:var(--disp);font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em}
.shead .en-h{font-family:var(--en);font-size:12.5px;color:var(--ink-3);font-style:normal}
.tagline{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 6px;font-weight:500}
section.aug .tagline{color:var(--amber)}
section.aug .shead{border-bottom-color:var(--amber)}
.why{font-size:12.5px;color:var(--ink-2);background:var(--amber-soft);border-left:2px solid var(--amber);
  padding:9px 13px;margin:12px 0 0;border-radius:0 2px 2px 0}

/* ---------- item ---------- */
.item{background:var(--surface);border:1px solid var(--rule);border-top:0;padding:20px 22px 22px}
.item:first-of-type{border-top:1px solid var(--rule)}
section.aug .item{box-shadow:inset 3px 0 0 var(--amber-soft)}
.ihead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.code{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.06em}
section.aug .code{color:var(--amber)}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;
  border:1px solid var(--steel);color:var(--steel);background:var(--steel-soft)}
.chip.mkt{border-color:var(--rule);color:var(--ink-3);background:var(--surface-2)}
.chip.fn{border-color:var(--rule);color:var(--ink-2);background:transparent}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:0 30px}
.cols>*{min-width:0}
.ko-col{padding-right:30px;border-right:1px solid var(--rule-soft);min-width:0}
.en-col{color:var(--ink-2);min-width:0}
.ko-col h3{font-family:var(--disp);font-size:17.5px;font-weight:700;line-height:1.42;margin:0 0 9px;
  letter-spacing:-.01em;text-wrap:balance}
.ko-col p{margin:0;font-size:14.5px;line-height:1.78}
.en-col h3{font-family:var(--en);font-size:14px;font-weight:600;line-height:1.45;margin:0 0 9px;color:var(--ink-2)}
.en-col p{font-family:var(--en);font-size:13.5px;line-height:1.7;margin:0}

/* ---------- gap card ---------- */
.gap{background:var(--surface);border:1px dashed var(--rule);padding:20px 22px;border-radius:2px}
.gap h3{font-family:var(--disp);font-size:16px;margin:0 0 8px}
.gap p{font-size:13.5px;color:var(--ink-2);margin:0 0 14px;max-width:70ch}
.watch{display:grid;gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft)}
.watch-row{background:var(--surface);display:grid;grid-template-columns:150px 1fr;gap:14px;padding:9px 13px;font-size:13px}
.watch-row .w-k{font-family:var(--mono);font-size:11px;color:var(--steel);letter-spacing:.04em;padding-top:3px}
.watch-row .w-v{color:var(--ink-2)}
.watch-row .w-v em{font-style:normal;color:var(--ink);font-weight:500}

/* ---------- sources ---------- */
.src-sec{margin-top:56px;border-top:2px solid var(--ink);padding-top:22px}
.src-sec h2{font-family:var(--disp);font-size:22px;margin:0 0 4px}
.src-sec .lead{font-size:13px;color:var(--ink-2);margin:0 0 22px}
.src-grp{margin-bottom:26px}
.src-grp h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule);font-weight:500}
.src{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:13px}
.src .sc{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em;padding-top:2px}
.src-grp.aug .sc{color:var(--amber)}
.src .st{font-weight:500;margin-bottom:2px;line-height:1.5}
.src a{font-family:var(--mono);font-size:11.5px;color:var(--steel);word-break:break-all;text-decoration:none;line-height:1.6}
.src a:hover,.src a:focus-visible{text-decoration:underline}
.outlet{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}

footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;color:var(--ink-3);line-height:1.9}
footer b{color:var(--ink-2);font-weight:500}

@media (max-width:820px){
  .cols{grid-template-columns:1fr;gap:16px}
  .ko-col{border-right:0;padding-right:0;padding-bottom:16px;border-bottom:1px solid var(--rule-soft)}
  .watch-row{grid-template-columns:1fr;gap:2px}
  .src{grid-template-columns:1fr;gap:2px}
  .bar{position:static}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.std-sec{margin-top:52px;border-top:2px solid var(--ink);padding-top:22px}
.std-sec h2{font-family:var(--disp);font-size:22px;margin:0 0 4px}
.std-sec .lead{font-size:13px;color:var(--ink-2);margin:0 0 20px}
.std-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft)}
.std-card{background:var(--surface);padding:16px 18px 18px}
.std-card h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;font-weight:500}
.std-card ul{margin:0;padding-left:16px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.std-card li{margin-bottom:4px}
.std-card em{font-style:normal;color:var(--ink);font-weight:600}
.std-src{margin-top:16px;background:var(--surface-2);border:1px solid var(--rule);padding:14px 18px}
.std-src h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:500}
.std-src p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.7}

.src-in{margin-top:12px;padding-top:8px;border-top:1px solid var(--rule-soft)}
.src-1{font-size:11.5px;line-height:1.5;margin-bottom:3px}
.src-1:last-child{margin-bottom:0}
.s-out{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--steel);margin-right:6px;white-space:nowrap}
.s-date{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:6px;font-variant-numeric:tabular-nums}
a.s-tit{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
a.s-tit:hover,a.s-tit:focus-visible{color:var(--ink);border-bottom-color:var(--ink-3)}
.s-url{display:block;max-width:100%;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);opacity:.75;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.en-col .src-1{font-family:var(--en);font-size:11.5px}
.en-col .s-out,.en-col .s-date,.en-col .s-url{font-family:var(--mono)}
</style>
<style>
.edsw{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);border-radius:2px;overflow:hidden;
  background:var(--surface);margin:22px 0 0}
.ed-quick{display:flex;flex:1 1 340px;min-width:0}
.ed-more{display:flex;align-items:center;gap:9px;padding:9px 14px;flex:0 1 auto;
  border-left:1px solid var(--rule);background:var(--surface-2)}
.ed-more label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.ed-more select{font-family:var(--ko);font-size:12.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);border-radius:2px;padding:6px 9px;max-width:260px;cursor:pointer}
.ed-more select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:640px){
  .ed-quick{flex:1 1 100%}
  .ed-more{flex:1 1 100%;border-left:0;border-top:1px solid var(--rule)}
  .ed-more select{flex:1;max-width:none}
}
.edsw button{flex:1;text-align:left;font-family:var(--ko);padding:11px 16px;border:0;cursor:pointer;
  background:transparent;color:var(--ink-2);border-left:1px solid var(--rule)}
.edsw button:first-child{border-left:0}
.edsw button b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.edsw button span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;margin-top:3px;color:var(--ink-3)}
.edsw button[aria-pressed="true"]{background:var(--ink)}
.edsw button[aria-pressed="true"] b,.edsw button[aria-pressed="true"] span{color:var(--surface)}
.edsw button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- export panel ---------- */
.expbtn{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--surface);background:var(--ink);
  border:0;border-radius:2px;padding:6px 12px;cursor:pointer;margin-left:12px;white-space:nowrap}
.expbtn:hover{opacity:.88}
.expbtn .car{display:inline-block;margin-left:5px;font-size:9px;vertical-align:1px}
.barsep{width:1px;height:18px;background:var(--rule);margin-left:auto}
.exp{background:var(--surface);border:1px solid var(--rule);border-radius:3px;margin-top:22px;
  padding:20px 22px;box-shadow:var(--shadow);scroll-margin-top:64px}
.exp[hidden]{display:none}
.exp h2{font-family:var(--disp);font-size:19px;margin:0 0 4px}
.exp .lead{font-size:12.5px;color:var(--ink-2);margin:0 0 14px}
.exp-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--rule-soft)}
.exp-lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);min-width:74px}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{font-family:var(--ko);font-size:12.5px;padding:6px 14px;border:0;border-left:1px solid var(--rule);
  background:transparent;color:var(--ink-2);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.opts{display:flex;flex-wrap:wrap;gap:4px 14px}
.optsep{width:1px;height:16px;background:var(--rule-soft)}
.sumbtn{font-family:var(--ko);font-size:13px;font-weight:600;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--rule);border-radius:2px;padding:6px 12px;cursor:pointer}
.sumbtn:hover{border-color:var(--ink-3)}
.sumbtn .car{font-size:9px;margin-left:6px;color:var(--ink-3);display:inline-block}
.pickwrap[hidden]{display:none}
.og{display:flex;align-items:center;gap:8px;padding-right:16px;border-right:1px solid var(--rule-soft);margin-right:8px}
.og:last-of-type{border-right:0}
.og-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.lnk2{font-family:var(--ko);font-size:13px;color:var(--steel);background:none;border:0;cursor:pointer;
  padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.lnk2:hover{color:var(--ink)}
.lnk2:disabled{opacity:.35;cursor:not-allowed;text-decoration:none}
.opt{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.lnk{font-family:var(--mono);font-size:11px;color:var(--steel);background:none;border:0;cursor:pointer;padding:4px 4px}
.lnk:hover{text-decoration:underline}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:1px;background:var(--rule-soft);
  border:1px solid var(--rule-soft);margin-top:2px}
.pick-s{background:var(--surface);padding:11px 13px 12px}
.pick-s>label{display:flex;gap:7px;align-items:baseline;font-size:12.5px;font-weight:600;cursor:pointer}
.pick-s .sn{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.pick-i{display:flex;gap:6px;align-items:baseline;margin:6px 0 0 20px;font-size:12px;color:var(--ink-2);line-height:1.5;cursor:pointer}
.pick-i .ic{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none}
.pick-e{margin:6px 0 0 20px;font-size:11.5px;color:var(--ink-3)}
.exp-go{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.btn{font-family:var(--ko);font-size:13px;font-weight:600;padding:9px 16px;border-radius:2px;cursor:pointer;border:1px solid var(--ink)}
.btn.p{background:var(--ink);color:var(--surface)}
.btn.s{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.exp-note{font-size:11.5px;color:var(--ink-3)}
.exp-msg{font-size:12.5px;margin-top:10px;padding:9px 12px;border-radius:2px;line-height:1.6}
.exp-msg[hidden]{display:none}
.exp-msg.ok{background:var(--steel-soft);color:var(--steel);border-left:2px solid var(--steel)}

<script>
(function(){
var D=JSON.parse(document.getElementById('brief-data').textContent);
D.editions=D.editions.concat(D.monthly||[]);
var cur=0;

/* ================= V2 · 고객사별 보고서 (2026-11-15) =================
   공통: 01 정치·경제(s1) · 02 소비자 심리(s4) · 03 아웃바운드(s2)
   고객사별: A 목적지 수요 · B 항공·접근성 · C 판매 채널 · D 경쟁 동향 · E 고객사 소식 · F 시사점(사람 확정)
   기사의 cl:[{c:고객사id, s:'A'..'E'}] 로 배치. cl 이 없는 예전 판본은 계정 태그·섹션으로 추정. */
var COMMONSEC={s1:1,s4:1,s2:1};
var SLOTS=D.clientSlots||[];
var ACCS=(D.clients||[]).map(function(c){return {h:c.id,ko:c.ko,full:c.full,en:c.en,type:c.type,acc:c.acc,fuel:c.fuel,
 gap:c.gap?new RegExp(c.gap):null,comp:c.comp||[]};});
var TYPEN={board:'관광청',hotel:'호텔',airline:'항공'};
var COMMONTAG='장거리 전 계정';
var ACC=null, COMMON=true;
try{var _c=localStorage.getItem('v2-common');if(_c==='0')COMMON=false;}catch(e){}
var OLDMAP={s5:'B',s3:'C',s6:'C',s9:'C',s7:'D',s8:'E',s10:'B'};
function hasAcc(i,ko){return i.tags.some(function(t){return t[1]==='acc'&&t[0]===ko;});}
function isCommon(i){return i.tags.some(function(t){return t[0]===COMMONTAG;});}
function edHasCl(E){return E.items.some(function(i){return i.cl&&i.cl.length;});}
function slotOf(E,i,a){
 if(COMMONSEC[i.sec])return null;
 if(i.cl&&i.cl.length){for(var k=0;k<i.cl.length;k++)if(i.cl[k].c===a.h)return i.cl[k].s;return null;}
 if(edHasCl(E))return null;
 if(a.acc&&(hasAcc(i,a.acc)||(COMMON&&isCommon(i))))return OLDMAP[i.sec]||'C';
 if(i.sec==='s10'){var t=i.tags.map(function(x){return x[0];});
  if(a.h==='airlink'&&t.indexOf('아프리카')>=0)return 'B';
  if(a.h==='azul'&&t.indexOf('남미')>=0)return 'B';}
 return null;
}
function clientItems(E,a){var out=[];E.items.forEach(function(i){var s=slotOf(E,i,a);
 if(s){var c={};for(var k in i)c[k]=i[k];c.sec='c'+s;out.push(c);}});return out;}
var EVC={};
function EV(i){
 var E=D.editions[i];if(!ACC)return E;
 var key=i+'|'+ACC.h+'|'+COMMON;if(EVC[key])return EVC[key];
 var common=E.items.filter(function(x){return COMMONSEC[x.sec];}),mine=clientItems(E,ACC),V={},k;
 for(k in E)V[k]=E[k];
 V.items=common.concat(mine);V.clientCount=mine.length;V.board=[];
 if(E.fuel){V.fuel={};for(k in E.fuel)V.fuel[k]=E.fuel[k];
  V.fuel.rows=(E.fuel.rows||[]).filter(function(r){return ACC.fuel&&r.acc===ACC.fuel;});}
 var cn=(E.clientNotes||{})[ACC.h]||{},rows=[];
 if(cn.watch&&cn.watch.length)rows=cn.watch;
 else if(E.gap&&E.gap.rows&&ACC.gap)rows=E.gap.rows.filter(function(r){return ACC.gap.test(String(r[0]).toUpperCase());});
 V.gap=rows.length?{h:'이번 호 신규 없음 — 상시 모니터링 대상',p:'',rows:rows}:null;
 V.note=cn.so||'';
 V.issue={};for(k in E.issue)V.issue[k]=E.issue[k];V.issue.count=V.items.length;
 return EVC[key]=V;
}
function SECS(){
 if(!ACC)return D.sections;
 return D.sections.filter(function(s){return COMMONSEC[s.id];}).concat(SLOTS.map(function(s){
  return {id:'c'+s.id,n:s.id,ko:s.ko,en:s.en,why:(s.id==='D'&&ACC.comp.length)?'경쟁 기준: '+ACC.comp.join(' · '):''};}));
}
function accMatch(i){return true;}
function visItems(E){return E.items;}
function accCount(E,a){var n=0;E.items.forEach(function(i){if(slotOf(E,i,a))n++;});return n;}
function fuelVis(E){return (E.fuel&&E.fuel.rows)?E.fuel.rows:[];}
function gapRows(E){return (E.gap&&E.gap.rows)?E.gap.rows:[];}
function isMonthly(){var e=D.editions[cur];return !!(e&&e.kind==='monthly');}
function docTK(){return (ACC?ACC.full:'한국 아웃바운드')+(isMonthly()?' 월간 브리프':' 주간 브리프');}
function docTE(){return (ACC?ACC.en:'Korea Outbound')+(isMonthly()?' Monthly Brief':' Weekly Brief');}
function fBox(E){
 return '<section id="cF"><p class="tagline">'+ACC.full+' · F</p><div class="shead"><h2>시사점·액션</h2><span class="en-h">Implications &amp; Actions</span></div>'+
  (E.note?'<article class="item"><p>'+E.note+'</p></article>':'<p class="accnone">담당자가 확정합니다. 자동으로 작성하지 않습니다.</p>')+'</section>';
}
function accBar(){
 var el=document.getElementById('accf');if(!el)return;
 var F=D.editions[cur];
 var h=['<span class="accf-l">고객사</span><div class="accf-groups"><div class="accf-chips"><button type="button" data-acc="" aria-pressed="'+(!ACC)+'">전체 (내부용)<span class="n">'+F.items.length+'</span></button></div>'];
 ['board','hotel','airline'].forEach(function(t){
  var g=ACCS.filter(function(a){return a.type===t;});if(!g.length)return;
  h.push('<div class="accf-g"><span class="accf-gl">'+TYPEN[t]+'</span><div class="accf-chips">'+g.map(function(a){
   var n=accCount(F,a);
   return '<button type="button" data-acc="'+a.h+'" aria-pressed="'+(ACC===a)+'"'+(n?'':' class="zero"')+'>'+a.ko+'<span class="n">'+n+'</span></button>';}).join('')+'</div></div>');
 });
 h.push('</div>');
 if(!ACC||ACC.type==='board')h.push('<label class="accf-opt"><input type="checkbox" id="accf-common"'+(COMMON?' checked':'')+'> 장거리 공통 기사 포함(관광청)</label>');
 h.push(ACC?'<p class="accf-note">'+ACC.full+' 보고서: 공통 01–03 + 고객사별 A–F. 문서 만들기도 이 형태로 만들어집니다.</p>'
   :'<p class="accf-note">전체는 내부 검토용입니다. 고객사를 고르면 그 고객사 보고서가 됩니다.</p>');
 el.innerHTML=h.join('');
}
function accByHash(){var h=String(location.hash||'').replace(/^#/,'');for(var k=0;k<ACCS.length;k++)if(ACCS[k].h===h)return ACCS[k];return undefined;}
function setAcc(a,push){
 ACC=a||null;
 if(push){
  try{
   if(ACC)history.replaceState(null,'','#'+ACC.h);
   else if(accByHash())history.replaceState(null,'',location.pathname+location.search);
  }catch(e){}
 }
 show(cur);
}

/* 판본 순서: 최신 → 과거 (팀 수집본은 맨 뒤). 최신 2개는 버튼, 전체는 날짜 드롭다운 */
var WK=[],MO=[];D.editions.forEach(function(e,i){(e.kind==='monthly'?MO:WK).push(i);});WK.reverse();MO.reverse();
var ORDER=WK.concat(MO);
var QUICK=[WK[0]].concat(MO.length?[MO[0]]:[WK[1]]).filter(function(x){return x!=null;});
function edLabel(e){return e.label+' · '+e.sublabel;}
document.getElementById('edsw').innerHTML=
 '<div class="ed-quick">'+QUICK.map(function(i){var e=D.editions[i];
   return '<button type="button" data-i="'+i+'" aria-pressed="false"><b>'+e.label+'</b><span>'+e.sublabel+'</span></button>';
  }).join('')+'</div>'+
 '<div class="ed-more"><label for="edsel">지난 호 · 월간</label>'+
 '<select id="edsel" aria-label="발행 호 선택">'+[['주간 브리프',WK],['월간 브리프',MO]].filter(function(g){return g[1].length;}).map(function(g){return '<optgroup label="'+g[0]+'">'+g[1].map(function(i){return '<option value="'+i+'">'+edLabel(D.editions[i])+'</option>';}).join('')+'</optgroup>';}).join('')+'</select></div>';

function mast(E){
 return '<div class="mast-top"><div class="brandline">'+(E.kind==='monthly'?'Korea Monthly Travel Report':'Korea Weekly Travel Report')+'</div>'+
 '<div class="issue">ISSUE '+E.issue.no+' · '+E.issue.range+'</div></div>'+
 (ACC?'<p class="accview">'+ACC.full+' · '+ACC.en+' · 고객사 기사 '+E.clientCount+'건</p>':'')+
 '<h1>'+(ACC?ACC.full:'한국 아웃바운드')+(E.kind==='monthly'?' 월간 브리프':' 주간 브리프')+'</h1>'+
 '<div class="meta">'+E.meta.filter(function(m){return m[0]!=='작성';})
   .map(function(m){return '<span><b>'+m[0]+'</b> '+m[1]+'</span>';}).join('')+'</div>'+
 '<div class="byline"><b>작성</b> AVIAREPS Korea</div>';
}

function srcHtml(i,lang){
 var rows=i.src.filter(function(x){var ko=/[가-힣]/.test(x[0]);return lang==='ko'?ko:!ko;});
 if(!rows.length&&lang==='ko'&&!i.src.some(function(x){return /[가-힣]/.test(x[0]);}))return '';
 if(!rows.length)return '';
 return '<div class="src-in">'+rows.map(function(x){
  return '<div class="src-1"><span class="s-out">'+x[0]+'</span><span class="s-date">'+x[1]+'</span>'+
   '<a class="s-tit" href="'+x[2]+'" target="_blank" rel="noopener">'+x[3]+'</a>'+
   '<span class="s-url">'+x[2]+'</span></div>';}).join('')+'</div>';
}

function fuelFxRate(E){
 if(!E.ind)return null;
 var it=null;
 for(var n=0;n<E.ind.length;n++){if(/환율/.test(E.ind[n].k)||/Exchange/i.test(E.ind[n].ken||'')){it=E.ind[n];break;}}
 if(!it)return null;
 var v=parseFloat(String(it.v).replace(/,/g,''));
 return isNaN(v)?null:v;
}
function fuelUsd(krw,rate){
 if(!krw||!rate)return '';
 var n=parseFloat(String(krw).replace(/,/g,''));
 if(isNaN(n))return '';
 return '$'+Math.round(n/rate).toLocaleString('en-US');
}

function render(E){
var h=[];
if(E.ind&&E.ind.length){
 h.push('<div class="ind">'+E.ind.map(function(x){
  return '<div class="ind-c"><div class="ind-k">'+x.k+'</div><div class="ind-v">'+x.v+
   (x.u?'<span class="ind-u">'+x.u+'</span>':'')+'</div><div class="ind-s">'+x.sub+'</div>'+
   '<div class="ind-src"><a href="'+x.src[2]+'" target="_blank" rel="noopener">'+x.src[0]+' · '+x.src[1]+'</a></div></div>';
 }).join('')+'</div>');
}
if(E.fuel&&E.fuel.rows&&E.fuel.rows.length){
 var fxr=fuelFxRate(E);
 h.push('<div class="fuel"><h2>유류할증료 · 관광청 계정별</h2><p class="note">'+E.fuel.month+' 기준 국적사 국제선 편도 유류할증료(KRW'+(fxr?' · USD 환산 병기':'')+') · '+E.fuel.sub+'</p><div class="fuel-grid">'+
  fuelVis(E).map(function(r){
   var keU=fuelUsd(r.ke,fxr),ozU=fuelUsd(r.oz,fxr);
   return '<div class="fuel-c"><div class="fuel-nm">'+r.acc+' <span class="fuel-en">'+r.accen+'</span></div><div class="fuel-rows">'+
    '<div class="fuel-r"><span class="fuel-l">KE</span><span class="fuel-v'+(r.ke?'':' na')+'">'+(r.ke?r.ke+'<i> KRW'+(keU?' · '+keU:'')+'</i>':'해당없음')+'</span></div>'+
    '<div class="fuel-r"><span class="fuel-l">OZ</span><span class="fuel-v'+(r.oz?'':' na')+'">'+(r.oz?r.oz+'<i> KRW'+(ozU?' · '+ozU:'')+'</i>':'해당없음')+'</span></div>'+
    '</div></div>';
  }).join('')+'</div>'+
  (E.fuel.note?'<p class="fuel-foot">'+E.fuel.note+(fxr?' USD 환산은 상단 원/달러 환율 기준 근사치입니다.':'')+'</p>':'')+
  (E.fuel.src?'<p class="fuel-src">'+E.fuel.src[0]+' · '+E.fuel.src[1]+'</p>':'')+
  '</div>');
}
if(E.board&&E.board.length){h.push('<div class="board"><h2>Account Scoreboard</h2><p class="note">이번 주 '+E.issue.count+'건 중 각 계정에 연결되는 기사 수. 0~1건 계정은 다음 주 소싱 우선순위입니다.</p><div class="acc-grid">');
E.board.forEach(function(a){h.push('<div class="acc'+(a.hot?' hot':'')+(a.cold?' cold':'')+(ACC?(a.nm===ACC.ko?' sel':' dim'):'')+'"><div class="n'+(a.cold?' zero':'')+'">'+a.n+'</div><div class="nm">'+a.nm+'</div><div class="ds">'+a.ds+'</div></div>');});
h.push('</div></div>');}

h.push('<nav class="bar"><div class="navlinks">');
SECS().forEach(function(s){h.push('<a href="#'+s.id+'"'+(s.aug?' class="new"':'')+'>'+s.n+' '+s.ko.replace(/ · /g,'·')+'</a>');});
h.push('<a href="#std">편성 기준</a></div><span class="barsep"></span>'+
 '<button type="button" class="expbtn" id="expbtn" aria-expanded="false" aria-controls="exp">'+
 '문서 만들기<span class="car" id="expcar">▾</span></button></nav>');
h.push(expPanel(E));

SECS().forEach(function(s){
 var its=visItems(E).filter(function(i){return i.sec===s.id;});
 h.push('<section id="'+s.id+'"'+(s.aug?' class="aug"':'')+'>');
 h.push('<p class="tagline">'+((ACC&&/^c[A-E]$/.test(s.id))?ACC.full+' · '+s.n:'Section '+s.n+' · '+(s.aug?'신규 보완 영역':'기존 영역'))+'</p>');
 h.push('<div class="shead"><h2>'+s.ko+'</h2><span class="en-h">'+s.en+'</span></div>');
 if(s.why)h.push('<p class="why">'+s.why+'</p>');
 its.forEach(function(i){
  h.push('<article class="item"><div class="ihead"><span class="code">'+i.code+'</span>');
  i.tags.forEach(function(t){h.push('<span class="chip'+(t[1]==='acc'?'':' '+t[1])+'">'+t[0]+'</span>');});
  h.push('</div><div class="cols"><div class="ko-col"><h3>'+i.koh+'</h3><p>'+i.kop+'</p>'+
   (i.note?'<div class="editnote">'+i.note+'</div>':'')+
   (i.primary?'<div class="editnote">'+i.primary+'</div>':'')+
   srcHtml(i,'ko')+'</div><div class="en-col"><h3>'+i.enh+'</h3><p>'+i.enp+'</p>'+
   srcHtml(i,'en')+'</div></div></article>');
 });
 if(ACC&&!its.length)h.push('<p class="accnone">이번 호 이 섹션에는 '+ACC.ko+' 관련 기사가 없습니다.</p>');
 if((s.id==='s8'||s.id==='cE')&&E.gap&&E.gap.rows&&E.gap.rows.length){
  h.push('<div class="gap"><h3>'+E.gap.h+'</h3><p>'+E.gap.p+'</p><div class="watch">');
  gapRows(E).forEach(function(r){h.push('<div class="watch-row"><div class="w-k">'+r[0]+'</div><div class="w-v">'+r[1]+'</div></div>');});
  h.push('</div></div>');
 }
 h.push('</section>');
});


if(ACC)h.push(fBox(E));
h.push('<section id="std" class="std-sec"><h2>편성 기준</h2><p class="lead">2026년 8월 29일 확정 · 8월 31일 목차 개편(Section 07 패키지·럭셔리 신설). 두 판본 모두 동일 기준으로 편성합니다.</p><div class="std-grid">');
D.std.forEach(function(c){h.push('<div class="std-card"><h4>'+c.h+'</h4><ul>'+c.li.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>');});
h.push('</div><div class="std-src"><h4>확정 소스 로스터</h4><p>'+D.roster+'</p></div>');
h.push('<div class="std-src"><h4>'+D.bsp.title+'</h4><p style="margin-bottom:12px">'+D.bsp.note+'</p>'+
 '<div class="bsp"><div class="bsp-h"><span>순위</span><span>여행사</span><span>발권액(억원)</span><span>비중</span><span>유형</span></div>'+
 D.bsp.rows.map(function(r){return '<div class="bsp-r"><span>'+r[0]+'</span><span class="bsp-n">'+r[1]+'</span><span>'+r[2]+'</span><span>'+r[3]+'</span><span class="bsp-t">'+r[4]+'</span></div>';}).join('')+
 '</div></div>');
h.push('<div class="std-src"><h4>확인된 작동 URL</h4><div class="watch">'+D.urls.map(function(u){
 return '<div class="watch-row"><div class="w-k">'+u[0]+'</div><div class="w-v">'+u[1]+'</div></div>';}).join('')+'</div></div></section>');

h.push('<footer><b>Korea Weekly Travel Report</b> · Issue '+E.issue.no+' · '+E.label+'<br>'+
 E.foot+'<br>계정 태그와 섹션 구분은 AVIAREPS Korea 편집 기준이며 원문 기사의 표현이 아닙니다.</footer>');
return h.join('');
}

/* ================= 문서 내보내기 ================= */
var LANG='both', SEL={}, DL=null, DLASKED=false;
/* fn·code·secno·url·gen 은 B2B 독자에게 불필요해 항상 끔 (2026-08-31 확정) */
/* 원/달러 환율(fx)·CCSI(ccsi)는 문서 만들기에서 개별 선택 가능 (2026-09-12 확정) */
/* 유류할증료는 관광청 계정 단위로 개별 선택 (FSEL, 2026-09-12 확정) */
var OPT={acc:true,note:true,fn:false,code:false,secno:false,url:false,gen:false,fx:true,ccsi:true};
var OPTS=[['acc','계정·시장 태그'],['note','편집 기준 안내문'],['fx','원/달러 환율'],['ccsi','소비자심리지수(CCSI)']];
var FSEL={};

function indFiltered(E){
 if(!E.ind)return [];
 return E.ind.filter(function(x){
  if(/CCSI|소비자심리/.test(x.k))return OPT.ccsi;
  if(/환율/.test(x.k))return OPT.fx;
  return true;
 });
}

function legacyCopy(html,ok,fail){

/* 원화 값을 각 월 구간표의 적용환율(ROE)로 나눠 달러로 환산한 사본을 만든다 */
function trUsd(T){
 var o=JSON.parse(JSON.stringify(T));
 o.series.forEach(function(s){s.vals=s.vals.map(function(v,i){var r=T.months[i].roe;return (v==null||!r)?null:Math.round(v/r);});});
 return o;
}

function trNice(max,c){for(var i=0;i<c.length;i++){if(Math.ceil(max/c[i])<=6)return c[i];}return c[c.length-1];}
function trPctTxt(p){if(p==null)return '—';var r=Math.round(p*10)/10;return (r>0?'+':'')+r.toFixed(1)+'%';}
function trZones(T){var z=[];T.series.forEach(function(s){var q=s.zone||s.id;if(z.indexOf(q)<0)z.push(q);});return z;}
function trZk(T,s){return trZones(T).indexOf(s.zone||s.id);}
function trSel(T){return T.series.filter(trOn);}
/* 선택한 도시를 구간별 선으로 묶는다 (같은 구간 도시는 값이 같아 한 줄로 겹친다) */
function trGroups(T,C){
 var g=[],map={};
 trSel(T).forEach(function(s){
  var q=s.zone||s.id;
  if(!map[q]){map[q]={z:q,k:trZk(T,s),vals:s.vals,names:[]};g.push(map[q]);}
  map[q].names.push(trS(s,C,'long'));
 });
 g.forEach(function(x){x.name=x.names.join(' · ');});
 return g;
}
function trTw(s){var w=0;for(var i=0;i<s.length;i++)w+=s.charCodeAt(i)>255?12:6.6;return w;}
var TRPD={W:780,H:340};

/* 선택한 도시를 한 그래프에 — 도시(구간)마다 선 하나, 점마다 값 표시 */
function trendChart(T,C,P){
 var G=trGroups(T,C);if(!G.length)return '';
 var multi=G.length>1,W=780,L=54,R=40,Bt=34,ph=G.length>=4?400:(G.length>1?320:280),n=T.months.length,pw=W-L-R,max=0,lg=[],Tp=26;
 if(multi){
  var lx=L,row=0;
  G.forEach(function(x){
   var w=16+6+trTw(x.name)+24;
   if(lx>L&&lx+w>W-R){lx=L;row++;}
   lg.push({x:lx,y:16+row*19,g:x});lx+=w;
  });
  Tp=22+(row+1)*19+6;
 }
 var H=Tp+ph+Bt;
 G.forEach(function(x){x.vals.forEach(function(v){if(v!=null&&v>max)max=v;});});
 var step=trNice(max,C.steps),top=Math.max(step,Math.ceil(max/step)*step);
 function X(i){return L+(n>1?30+(pw-60)*i/(n-1):pw/2);}
 function Y(v){return Tp+ph*(1-v/top);}
 var sf=P?'#ffffff':'var(--surface)';
 function colOf(x){return P?TRP[x.k%7]:trCol(x.k);}
 if(P)TRPD={W:W,H:H};else TRGS[C.key]={W:W,L:L,Tp:Tp,ph:ph,n:n,X:X,Y:Y,G:G};
 var g=[];
 if(P)g.push('<rect width="'+W+'" height="'+H+'" fill="#ffffff"/>');
 lg.forEach(function(q){
  g.push('<line x1="'+q.x+'" x2="'+(q.x+16)+'" y1="'+q.y+'" y2="'+q.y+'" style="stroke:'+colOf(q.g)+';stroke-width:3;stroke-linecap:round"/>'+
   '<text class="tc-lg" x="'+(q.x+22)+'" y="'+(q.y+4)+'">'+esc(q.g.name)+'</text>');
 });
 for(var t=0;t<=top;t+=step){
  var y=Y(t);
  g.push('<line class="'+(t===0?'tc-base':'tc-grid')+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/>'+
   '<text class="tc-ax" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+C.ax(t)+'</text>');
 }
 T.months.forEach(function(m,i){
  g.push('<text class="tc-ax" x="'+X(i)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(trM(T,i,C))+'</text>');
 });
 G.forEach(function(x){
  var d='',pen=false;
  x.vals.forEach(function(v,i){
   if(v==null){pen=false;return;}
   d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true;
  });
  g.push('<path class="tc-line" d="'+d+'" style="stroke:'+colOf(x)+'"/>');
 });
 G.forEach(function(x){

/* 표 모델: 선택한 도시마다 한 줄. 화면 표와 저장 파일이 같이 쓴다 */
function trRowsModel(T,C){
 var EN=!!C.en,S=trSel(T),mn=function(i){return trM(T,i,C);};
 var rows=S.map(function(s){
  var i=trLast(s.vals),pk=trPeak(s.vals);
  return {s:s,k:trZk(T,s),label:trS(s,C,'long'),vals:s.vals,i:i,pk:pk,atPk:(pk===i),
   pPrev:i>0?trPct(s.vals[i],s.vals[i-1]):null,pPeak:(pk===i)?null:trPct(s.vals[i],s.vals[pk])};
 });
 var r0=rows[0],sameI=rows.every(function(r){return r.i===r0.i;}),samePk=sameI&&rows.every(function(r){return r.pk===r0.pk;});
 var allPk=samePk&&r0.atPk;
 var m={rows:rows,sameI:sameI,samePk:samePk,multi:rows.length>1};
 m.h1Prev=EN?'vs prev. month':'전월 대비';
 m.h1Peak=EN?'vs peak':'Peak 대비';
 m.s1Prev=sameI?mn(r0.i)+' vs '+(r0.i>0?mn(r0.i-1):''):'';
 m.s1Peak=samePk?(allPk?(EN?'year high':'연중 최고'):mn(r0.i)+' vs '+mn(r0.pk)):(EN?'vs peak month':'정점 월 대비');
 m.hPrev=sameI?(EN?mn(r0.i)+' vs '+(r0.i>0?mn(r0.i-1):''):mn(r0.i)+' · '+(r0.i>0?mn(r0.i-1):'')+' 대비'):m.h1Prev;
 m.hPeak=samePk?(EN?mn(r0.i)+' vs peak'+(allPk?'':' ('+mn(r0.pk)+')'):mn(r0.i)+' · 정점'+(allPk?'':'('+mn(r0.pk)+')')+' 대비'):m.h1Peak;
 /* 정점 월이 도시마다 다르면 칸 안에 월을 붙인다 */
 m.pkTag=function(r){return (!samePk&&!r.atPk)?' ('+mn(r.pk)+')':'';};
 m.yh=EN?'Year high':'연중 최고';
 return m;
}

function trSplit(T){

function finSz(n){return n>=1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';}
function finErr(e){

 if(c==='too_large')return '파일이 너무 큽니다(최대 20MB).';
 if(c==='quota_or_state'||c==='quota_exceeded')return '저장 공간이 가득 찼습니다. 오래된 파일을 지운 뒤 다시 시도해 주세요.';
 if(c==='rate_limited'||c==='resource_exhausted')return '요청이 너무 잦습니다. 잠시 뒤 다시 시도해 주세요.';
 if(c==='not_granted')return '이 화면에서는 권한이 없습니다(편집 권한이 필요합니다).';
 return (e&&e.message)||'알 수 없는 오류입니다.';

/* ---------- 파일 올리기 ---------- */
function finExt(n){var m=/\.([^.]+)$/.exec(n||'');return m?m[1].toLowerCase():'';}
function finBase(n){return (n||'').replace(/\.[^.]+$/,'');}
function finLib(src,test){return new Promise(function(ok,no){loadScript(src,test,ok,function(){no(new Error('변환 도구를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.'));});});}
async function finReadText(file){
 var buf=await file.arrayBuffer();
 try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
 catch(e){try{return new TextDecoder('euc-kr',{fatal:true}).decode(buf);}catch(e2){throw new Error('텍스트 인코딩을 읽을 수 없습니다. UTF-8 또는 EUC-KR로 저장해 주세요.');}}
}
async function finDocx(file){
 await finLib('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js',function(){return typeof mammoth!=='undefined';});
 var res=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});
 var doc=new DOMParser().parseFromString('<body>'+res.value+'</body>','text/html'),out=[];
 Array.prototype.forEach.call(doc.body.children,function(el){
  if(el.tagName==='TABLE'){Array.prototype.forEach.call(el.querySelectorAll('tr'),function(tr){out.push(Array.prototype.map.call(tr.children,function(c){return c.textContent.trim().replace(/\s+/g,' ');}).join(' | '));});out.push('');}
  else{var t=el.textContent.trim();if(t)out.push(t);}
 });
 return out.join('\n').trim();
}
async function finXlsx(file){
 await finLib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',function(){return typeof XLSX!=='undefined';});
 var wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),res=[];
 wb.SheetNames.forEach(function(sn){var csv=XLSX.utils.sheet_to_csv(wb.Sheets[sn],{blankrows:false}).trim();if(csv)res.push({sheet:sn,csv:csv});});
 if(!res.length)throw new Error('내용이 있는 시트가 없습니다.');
 return res;
}
async function finDetect(file,kind,text){
 var nm=file.name||'',h=/roe|환율|exchange/i.test(nm)?'roe':(/유류|fuel|surcharge|구간|할증/i.test(nm)?'table':null);
 if(!h&&text){if(/IATA|ROE|환율/i.test(text)&&!/마일|구간|대권/.test(text))h='roe';else if(/유류할증료|대권거리|마일|surcharge/i.test(text))h='table';}
 if(!h&&/트리니티|티웨이|trinity|t.?way/i.test(nm))h='table';
 var out={cat:h||'etc',carrier:/트리니티|티웨이|trinity|t.?way/i.test(nm)?'trn':'',guess:null,month:'',msg:''};
 if(!FINSM||(kind!=='image'&&!text))return out;
 var prompt='첨부 자료가 무엇인지 판별하고 값을 읽어 JSON으로만 답하세요. 1) 항공사 IATA ROE(환율) 변경 공지: {"kind":"roe","month":"YYYY-MM","roe":숫자} — 괄호 안의 현재(Current) 값이 아니라 \'변경 내용\'의 새로 적용되는 KRW per USD 값을 쓰세요. 2) 대한항공 한국발 유류할증료 통보표(편도, 원): {"kind":"table","month":"YYYY-MM","level":단계숫자 또는 null,"bands":{"~499":0,"500~999":0,"1,000~1,499":0,"1,500~1,999":0,"2,000~2,999":0,"3,000~3,999":0,"4,000~4,999":0,"5,000~6,499":0,"6,500~9,999":0,"10,000~":0}} — 열은 대권거리 구간이고 행은 \'현행\'과 \'변경\'이며, \'변경\'(새로 적용) 행의 금액을 쉼표 없는 숫자로 쓰세요. 3) 트리니티항공(옛 티웨이항공) 부과군표(1군~7군, 운항 거리 miles, 편도 원): {"kind":"table","carrier":"trn","month":"YYYY-MM","bands":{"1군":0,"2군":0,"3군":0,"4군":0,"5군":0,"7군":0}} — 금액이 \'-\'인 군은 생략하고 month는 적용 기간의 달입니다. 4) 부과군별 노선(도시) 목록: {"kind":"routes"}. 5) 그 밖의 자료: {"kind":"other"}. month는 새 값이 적용되는 달입니다.';
 var url=null;
 try{
  var o={};
  if(kind==='image'){url=URL.createObjectURL(file);o.images=await finImgBlob(url);}
  else prompt+='\n\n[자료 내용]\n'+String(text).slice(0,12000);
  var r=await FINSM.json(prompt,o);
  if(r&&typeof r==='object'){
   if(typeof r.month==='string'&&/^\d{4}-\d{2}$/.test(r.month))out.month=r.month;
   if(r.kind==='roe'){var n=finNum(r.roe);out.cat='roe';if(n&&n>=500&&n<=5000){out.guess={roe:n};out.msg='ROE 자료로 인식했습니다. 아래 값을 원본과 대조해 확인해 주세요.';}}
   else if(r.kind==='table'&&r.carrier==='trn'&&r.bands&&typeof r.bands==='object'){
    var tb={},tc=0;TBANDS.forEach(function(b){var v=finNum(r.bands[b]);if(v){tb[b]=v;tc++;}});
    out.cat='table';out.carrier='trn';if(tc){out.guess={bands:tb};out.msg='트리니티항공 부과군표로 인식했습니다. 아래 값을 원본과 대조해 확인해 주세요.';}
   }
   else if(r.kind==='routes'){out.cat='etc';out.ref=true;out.msg='부과군별 노선 목록으로 인식했습니다. 입력할 금액이 없어 보관만 합니다(도시 목록은 이미 반영되어 있습니다).';}
   else if(r.kind==='table'&&r.bands&&typeof r.bands==='object'){
    var bs={},c=0;BANDS.forEach(function(b){var v=finNum(r.bands[b]);if(v){bs[b]=v;c++;}});
    out.cat='table';if(c){out.guess={bands:bs};var lv=finNum(r.level);if(lv)out.guess.level=lv;out.msg='유류할증료 구간표로 인식했습니다. 아래 값을 원본과 대조해 확인해 주세요.';}
   }else if(r.kind==='other'&&!h)out.cat='etc';
  }
 }catch(e){out.msg=h?'자동 읽기에 실패했습니다('+((e&&e.message)||'오류')+'). '+(h==='roe'?'ROE':'구간표')+'로 보고 값을 직접 입력해 주세요.':'자동 인식에 실패했습니다. 아래에서 종류를 골라 주세요.';}
 if(url)URL.revokeObjectURL(url);
 if(out.guess===null&&(out.cat==='roe'||out.cat==='table')&&!out.msg)out.msg='종류는 알아봤지만 값은 읽지 못했습니다. 직접 입력해 주세요.';
 return out;
}
async function finHandle(file){
 var e=finExt(file.name),parts=[],kind,note='',text='',ref0=false;
 try{
  if(e==='jpg'||e==='jpeg'||e==='png'){kind='image';var r=await FINAS.upload(file,{type:e==='png'?'image/png':'image/jpeg'});parts.push({id:r.id,label:file.name,type:r.contentType,size:r.sizeBytes});}
  else if(e==='pdf'){kind='pdf';var r2=await FINAS.upload(file,{type:'application/pdf'});parts.push({id:r2.id,label:file.name,type:r2.contentType,size:r2.sizeBytes});}
  else if(e==='txt'||e==='md'||e==='csv'||e==='json'){kind='text';var t=await finReadText(file);text=t;var ty=e==='md'?'text/markdown':e==='csv'?'text/csv':e==='json'?'application/json':'text/plain';var r3=await FINAS.upload(new Blob([t],{type:ty}),{type:ty});parts.push({id:r3.id,label:file.name,type:r3.contentType,size:r3.sizeBytes});}
  else if(e==='xlsx'||e==='xls'){kind='sheet';var sh=await finXlsx(file);text=sh.map(function(x){return x.csv;}).join('\n');for(var i=0;i<sh.length;i++){var r4=await FINAS.upload(new Blob([sh[i].csv],{type:'text/csv'}),{type:'text/csv'});parts.push({id:r4.id,label:finBase(file.name)+' · '+sh[i].sheet+'.csv',type:r4.contentType,size:r4.sizeBytes});}note=sh.length+'개 시트를 CSV로 변환';}
  else if(e==='docx'){kind='doc';var dt=await finDocx(file);text=dt;if(!dt)throw new Error('문서에서 글자를 찾지 못했습니다.');var r5=await FINAS.upload(new Blob([dt],{type:'text/plain'}),{type:'text/plain'});parts.push({id:r5.id,label:finBase(file.name)+'.txt',type:r5.contentType,size:r5.sizeBytes});note='글자·표를 텍스트로 변환';}
  else throw new Error('지원하지 않는 형식입니다: .'+(e||'?'));
  var cat=UF.cat,month=UF.month||'',guess=null,msg,carrier='';
  if(cat==='trnt'){cat='table';carrier='trn';}
  if(cat==='auto'){
   finMsg('info',file.name+' — 종류를 알아보는 중…');
   var dr=await finDetect(file,kind,text);cat=dr.cat;guess=dr.guess;carrier=dr.carrier||'';if(!month&&dr.month)month=dr.month;msg=dr.msg;if(dr.ref)ref0=true;
  }
  if(!month)month=finNextMonth();
  var rec={name:file.name,kind:kind,cat:cat,month:month,createdAt:new Date().toISOString(),parts:parts,note:note};
  if(guess)rec.guess=guess;
  if(carrier)rec.carrier=carrier;
  if(cat==='etc'&&UF.cat==='auto'&&!ref0)rec.unk=true;
  var ref=await FINDB.collection('uploads').add(rec);
  if((cat==='roe'||cat==='table')&&ref&&ref.id){if(UPL.some(function(x){return x.id===ref.id;}))finOpenCf(ref.id);else OPENID=ref.id;}
  finMsg('ok',file.name+' 저장 완료'+(note?' ('+note+')':'')+' — '+(msg||(cat==='etc'?'종류를 알아보지 못했습니다. 아래에서 ROE인지 구간표인지 골라 주세요.':'아래에서 \'입력 확인\'을 눌러 주세요.')));
 }catch(err){
  for(var k=0;k<parts.length;k++){try{await FINAS.delete(parts[k].id);}catch(x){}}
  finMsg('err',file.name+' — '+finErr(err));
 }
}
async function finUploadAll(files){
 if(!FINAS||!FINDB){finMsg('err','저장 기능을 사용할 수 없습니다.');return;}
 FBUSY=true;finBoxRender();

 FBUSY=false;finBoxRender();

/* ---------- 입력 확인 ---------- */
function finOpenCf(id){
 var d=UPL.filter(function(x){return x.id===id;})[0];if(!d)return;
 var month=d.month||UF.month,cur=FIN.filter(function(x){return x&&x.month===month&&x.carrier!=='trn';})[0]||{};
 var g=d.guess||{},car=d.carrier==='trn'?'trn':'';
 if(car)cur=FIN.filter(function(x){return x&&x.id==='trn-'+month;})[0]||{};
 CF={car:car,id:id,month:month,roe:cur.roe!=null&&d.cat==='roe'?String(cur.roe):(d.cat==='roe'&&g.roe?String(g.roe):''),level:cur.level!=null&&d.cat==='table'?String(cur.level):(d.cat==='table'&&g.level?String(g.level):''),bands:d.cat==='table'&&cur.bands?JSON.parse(JSON.stringify(cur.bands)):(d.cat==='table'&&g.bands?JSON.parse(JSON.stringify(g.bands)):{}),busy:false};
 finBoxRender();
}
function finImgBlob(src){return new Promise(function(res,rej){var im=new Image();im.onload=function(){try{var c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);c.toBlob(function(b){b?res(b):rej(new Error('이미지를 읽지 못했습니다.'));},'image/png');}catch(e){rej(e);}};im.onerror=function(){rej(new Error('이미지를 불러오지 못했습니다.'));};im.src=src;});}
async function finRead(){
 if(!CF||!FINSM)return;
 var d=UPL.filter(function(x){return x.id===CF.id;})[0];if(!d||!d.parts||!d.parts[0])return;
 CF.busy=true;finBoxRender();
 try{
  var blob=await finImgBlob('/_blob/'+d.parts[0].id);
  var prompt=d.carrier==='trn'?TPROMPT:d.cat==='roe'
   ?'첨부 이미지는 항공사의 IATA ROE 변경 공지입니다. 새로 적용되는 ROE(KRW per USD)와 적용 월을 읽어 JSON으로만 답하세요. 괄호 안의 Current(현재) 값이 아니라 \'변경 내용\'의 새 값을 쓰세요. 형식: {"month":"YYYY-MM","roe":숫자}'
   :'첨부 이미지는 대한항공 한국발 유류할증료 통보표(편도, 원)입니다. 열은 대권거리 구간이고 행은 \'현행\'과 \'변경\'입니다. \'변경\' 행(새로 적용되는 금액)을 읽어 JSON으로만 답하세요. 쉼표 없는 숫자로, 형식: {"month":"YYYY-MM","bands":{"~499":0,"500~999":0,"1,000~1,499":0,"1,500~1,999":0,"2,000~2,999":0,"3,000~3,999":0,"4,000~4,999":0,"5,000~6,499":0,"6,500~9,999":0,"10,000~":0}}';
  var r=await FINSM.json(prompt,{images:blob});
  if(r&&typeof r==='object'){
   if(typeof r.month==='string'&&/^\d{4}-\d{2}$/.test(r.month))CF.month=r.month;
   if(d.cat==='roe'){var n=finNum(r.roe);if(n)CF.roe=String(n);}
   else if(r.bands&&typeof r.bands==='object'){(CF.car==='trn'?TBANDS:BANDS).forEach(function(b){var v=finNum(r.bands[b]);if(v)CF.bands[b]=v;});}
  }
  finMsg('info','이미지에서 읽은 값을 채웠습니다. 이미지와 같은지 확인한 뒤 \'입력 확인 (저장)\'을 눌러 주세요.');
 }catch(e){finMsg('err','값을 읽지 못했습니다 — '+((e&&e.message)||'다시 시도해 주세요')+'. 직접 입력해도 됩니다.');}
 if(CF)CF.busy=false;finBoxRender();
}
async function finSetCat(id,c){
 try{OPENID=id;await FINDB.collection('uploads').doc(id).update(c==='trnt'?{cat:'table',carrier:'trn'}:{cat:c});}catch(e){OPENID=null;finMsg('err','종류를 바꾸지 못했습니다 — '+finErr(e));}
}
async function finSave(){
 if(!CF)return;
 var d=UPL.filter(function(x){return x.id===CF.id;})[0];if(!d)return;
 if(!/^\d{4}-\d{2}$/.test(CF.month)){finMsg('err','적용 월을 고르세요.');return;}
 var patch={month:CF.month,updatedAt:new Date().toISOString()};
 if(d.cat==='roe'){
  var r=finNum(CF.roe);if(!r||r<500||r>5000){finMsg('err','ROE 값을 확인하세요(KRW/USD, 예: 1342.368471).');return;}
  patch.roe=r;patch.roeSrc=d.id;
 }else{
  var bands={},cnt=0;
  (CF.car==='trn'?TBANDS:BANDS).forEach(function(b){var v=finNum(CF.bands[b]);if(v){bands[b]=v;cnt++;}});
  if(!cnt){finMsg('err','구간별 금액을 하나 이상 입력하세요.');return;}
  patch.bands=bands;patch.tableSrc=d.id;
  if(CF.car==='trn')patch.carrier='trn';else{var lv=finNum(CF.level);patch.level=lv?lv:null;}
 }
 try{
  var ref=FINDB.doc('fuelInputs/'+(CF.car==='trn'?'trn-':'')+CF.month),snap=await ref.get(),cur=(snap&&snap.exists)?(snap.data()||{}):{};
  var next=Object.assign({},cur,patch);
  if(d.cat==='table'){next.bands=Object.assign({},cur.bands||{},patch.bands);}
  next.status='confirmed';delete next.appliedAt;
  await ref.set(next);
  await FINDB.collection('uploads').doc(d.id).update({checked:true,checkedAt:new Date().toISOString()});
  finMsg('ok',CF.month+' '+(d.cat==='roe'?'ROE':(CF.car==='trn'?'트리니티항공 부과군표':'구간표'))+' 입력을 확인했습니다. 아래 \'그래프에 반영\'을 눌러 주세요.');
  CF=null;finBoxRender();
 }catch(e){finMsg('err','저장하지 못했습니다 — '+finErr(e));}
}

async function finApply(months,on){
 try{

  }

}
async function finDelete(id){
 var d=UPL.filter(function(x){return x.id===id;})[0];DELQ=null;if(!d){finBoxRender();return;}
 try{
  for(var i=0;i<(d.parts||[]).length;i++){try{if(FINAS)await FINAS.delete(d.parts[i].id);}catch(x){}}
  await FINDB.collection('uploads').doc(id).delete();
  if(CF&&CF.id===id)CF=null;
  finMsg('ok',d.name+' 삭제했습니다.');
 }catch(e){finMsg('err','삭제하지 못했습니다 — '+finErr(e));}
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',function(ev){
 var b=ev.target.closest&&ev.target.closest('[data-fin]');if(!b||b.disabled)return;
 var a=b.dataset.fin;
 if(a==='toggle'){FINOPEN=!FINOPEN;finBoxRender();finRefreshActions();if(FINOPEN&&FINBOX)FINBOX.scrollIntoView({block:'nearest',behavior:'smooth'});}
 else if(a==='close'){FINOPEN=false;finBoxRender();finRefreshActions();}
 else if(a==='applyall'){finApply(finPend().map(function(x){return x.id||x.month;}),true);}
 else if(a==='apply'){finApply([b.dataset.m],true);}
 else if(a==='unapply'){finApply([b.dataset.m],false);}
 else if(a==='pastebtn'){finPasteBtn();}
 else if(a==='pick'){var f=$f('fin-file');if(f)f.click();}
 else if(a==='confirm'){finOpenCf(b.dataset.id);}
 else if(a==='setcat'){finSetCat(b.dataset.id,b.dataset.c);}
 else if(a==='cancel'){CF=null;finBoxRender();}
 else if(a==='read'){finRead();}
 else if(a==='save'){finSave();}
 else if(a==='delask'){DELQ=b.dataset.id;finBoxRender();}
 else if(a==='delno'){DELQ=null;finBoxRender();}
 else if(a==='del'){finDelete(b.dataset.id);}
});
function finStamp(){var d=new Date(),p=function(n){return ('0'+n).slice(-2);};return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}
function finPasteFiles(blobs){
 var st=finStamp(),list=blobs.map(function(b,i){var ext=/jpe?g/.test(b.type)?'jpg':'png';return new File([b],'capture-'+st+(blobs.length>1?'-'+(i+1):'')+'.'+ext,{type:ext==='jpg'?'image/jpeg':'image/png'});});
 finUploadAll(list);
}
async function finPasteBtn(){
 if(!FINAS||FBUSY)return;
 try{
  if(!navigator.clipboard||!navigator.clipboard.read)throw new Error('x');
  var items=await navigator.clipboard.read(),blobs=[];
  for(var i=0;i<items.length;i++){var ty=items[i].types.filter(function(t){return /^image\/(png|jpeg)$/.test(t);})[0];if(ty)blobs.push(await items[i].getType(ty));}
  if(!blobs.length){finMsg('err','클립보드에 이미지가 없습니다. 화면을 캡처(Win: Win+Shift+S, Mac: ⌘+Shift+4)한 뒤 다시 눌러 주세요.');return;}
  finPasteFiles(blobs);
 }catch(e){finMsg('err','이 화면에서는 붙여넣기 버튼이 막혀 있습니다. 이 창을 연 상태에서 Ctrl+V(Mac은 ⌘V)를 눌러 붙여넣어 주세요.');}
}
document.addEventListener('paste',function(ev){
 if(!FINOPEN||!FINAS||FBUSY)return;
 var cd=ev.clipboardData;if(!cd||!cd.items)return;
 var blobs=[];Array.prototype.forEach.call(cd.items,function(it){if(it.kind==='file'&&/^image\/(png|jpeg)$/.test(it.type)){var f=it.getAsFile();if(f)blobs.push(f);}});
 if(!blobs.length)return;

document.addEventListener('input',function(ev){
 var t=ev.target,k=t&&t.dataset&&t.dataset.ff;if(!k)return;
 if(k==='ucat')UF.cat=t.value;else if(k==='umonth')UF.month=t.value;

 }
