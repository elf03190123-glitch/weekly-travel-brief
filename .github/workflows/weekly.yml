name: weekly
# 매주 월요일 10:00 KST: 수집 → Claude(Agent SDK)가 선별·작성 → 커밋 → Pages 배포
# 필요: 저장소 Secret ANTHROPIC_API_KEY (Max 요금제 월 API 크레딧이 연결된 Console 조직의 키)
# 선택: 저장소 변수 BRIEF_MODEL (기본 claude-opus-5-5)
on:
  schedule:
    - cron: '0 1 * * 1'   # 01:00 UTC = 10:00 KST
  workflow_dispatch:
    inputs:
      end:
        description: '기간 끝 (KST, 예: 2026-11-16T10:00). 비우면 이번 월요일 10:00'
        required: false
      smoke:
        description: '짧은 확인만 (크레딧으로 처리되는지)'
        type: boolean
        default: false

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      published: ${{ steps.commit.outputs.published }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
    steps:
      - name: Check API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::저장소 Secret ANTHROPIC_API_KEY 가 없습니다."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Claude Agent SDK
        run: python3 -m pip install --quiet claude-agent-sdk
      - name: Smoke test
        if: ${{ github.event.inputs.smoke == 'true' }}
        run: python3 -I scripts/write_edition.py --smoke
      - name: Window
        if: ${{ github.event.inputs.smoke != 'true' }}
        id: win
        run: |
          export TZ=Asia/Seoul
          if [ -n "${{ github.event.inputs.end }}" ]; then END="${{ github.event.inputs.end }}"; else
            END="$(date -d "$(date +%Y-%m-%d) -$(( ($(date +%u) + 6) % 7 )) days" +%Y-%m-%d)T10:00"; fi
          START="$(date -d "${END%T*} -7 days" +%Y-%m-%d)T10:00"
          LABEL="$(date -d "${START%T*}" +%G-W%V)"
          echo "start=$START" >> "$GITHUB_OUTPUT"; echo "end=$END" >> "$GITHUB_OUTPUT"; echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "기간 $START ~ $END · 라벨 $LABEL"
      - name: Collect + candidates
        if: ${{ github.event.inputs.smoke != 'true' }}
        run: python3 -I scripts/collect.py --window "${{ steps.win.outputs.start }}" "${{ steps.win.outputs.end }}" --label "${{ steps.win.outputs.label }}"
      - name: Claude writes the edition (Agent SDK)
        if: ${{ github.event.inputs.smoke != 'true' }}
        run: python3 -I scripts/write_edition.py --label "${{ steps.win.outputs.label }}" --start "${{ steps.win.outputs.start }}" --end "${{ steps.win.outputs.end }}"
      - name: Monthly briefs (주간 기사를 기사 날짜 기준 월별로 다시 묶음)
        if: ${{ always() && github.event.inputs.smoke != 'true' && steps.win.outcome == 'success' }}
        run: python3 -I scripts/make_monthly.py && python3 -I scripts/build.py --check
      - name: Commit
        id: commit
        if: ${{ always() && github.event.inputs.smoke != 'true' && steps.win.outcome == 'success' }}
        run: |
          git config user.name "weekly-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data runs
          if git diff --cached --quiet; then echo "published=false" >> "$GITHUB_OUTPUT"; echo "변경 없음"; exit 0; fi
          git commit -m "weekly: ${{ steps.win.outputs.label }}"
          git pull --rebase --autostash
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: write
    if: needs.write.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
